[project]
name = "ai3d-designer"
version = "0.1.0"
description = "Offline AI 3D Designer - Local LLM-driven CAD generation for mechanical parts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - All rights reserved"}
authors = [
    {name = "Diganta Chakraborty", email = "digantachakra812@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: CAD",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]
dependencies = [
    "cryptography>=42.0.0",
    "build123d>=0.13.0,<0.14.0",
    "pydantic>=2.14.1",
    "trimesh>=5.1.1",
    "manifold3d>=3.5.4",
    "pyvista>=0.49.1",
    "pyvistaqt>=0.13.1",
    "numpy>=2.2.6",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.10.0",
    "scipy>=1.13.0",
    "PySide6-Essentials>=6.12.0",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "lib3mf>=2.5.0",
    "svgwrite>=1.4.3",
    "lxml>=5.3.0",
    "requests>=2.32.3",
    "tqdm>=4.66.5",
    "psutil>=7.0.0",
    "pywin32>=308",
    "appdirs>=1.4.4",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
    "PyMuPDF>=1.24.10,<2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "hypothesis>=6.170.1",
    "pyinstaller>=6.22.3",
]
test = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "hypothesis>=6.170.1",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai3d_designer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "T20", "ARG", "PTH", "ERA", "PL", "TRY", "SIM", "NPY", "RUF", "TID", "QF", "TD"]
ignore = ["S101", "T201"]
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
namespace_packages = true

[tool.coverage.run]
source = ["src/ai3d_designer"]
omit = ["*/tests/*", "*/test_*"]

[tool.pyinstaller]
spec = "ai3d_designer.spec"
