[build]
builder = "DOCKERFILE"
dockerfilePath = "python-backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# The Dockerfile installs tesseract-ocr and the Python OCR dependencies.
# Keep the Railway service root at the repository root so COPY src/ works.
# For new services, select Dockerfile + this path in Railway service settings.
