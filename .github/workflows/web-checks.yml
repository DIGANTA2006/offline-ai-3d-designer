name: Web Frontend Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/cad-engine-reliability-upgrade-20261023
      - feat/dev2-printability-project-workflow-20261103
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-quality:
    name: Next.js lint, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://build_user:build_password@127.0.0.1:5432/offline_ai_build?schema=public
      DIRECT_URL: postgresql://build_user:build_password@127.0.0.1:5432/offline_ai_build?schema=public
      NEXT_PUBLIC_APP_URL: https://build.invalid
      NEXT_PUBLIC_FIREBASE_API_KEY: build-only-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: build.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: offline-ai-build
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: offline-ai-build.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:build-only"
      FIREBASE_PROJECT_ID: offline-ai-build
      FIREBASE_CLIENT_EMAIL: build-only@example.invalid
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nbuild-only-placeholder\n-----END PRIVATE KEY-----"
      CAD_SERVICE_URL: https://cad-build.invalid
      CAD_SERVICE_TOKEN: build-only-token-not-a-credential
      PRIVATE_BLOB_READ_WRITE_TOKEN: build-only-private-blob-token
      BLOB_READ_WRITE_TOKEN: build-only-blob-token
      INITIAL_ADMIN_EMAIL: admin@example.invalid
      CRON_SECRET: build-only-cron-secret-not-a-credential
      RAZORPAY_KEY_ID: rzp_test_build_only
      RAZORPAY_KEY_SECRET: build-only-razorpay-secret
      RAZORPAY_PLAN_ID: plan_replace_with_your_monthly_500_plan_id
      RAZORPAY_WEBHOOK_SECRET: build-only-webhook-secret
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_build_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Project retention unit tests
        run: npm run test:retention
      - name: Upload content-signature tests
        run: npm run test:upload-validation
      - name: Upload API route behavior tests
        run: npm run test:upload-route
      - name: Subscription entitlement policy tests
        run: npm run test:subscription-policy
      - name: Project printability API route tests
        run: npm run test:printability-route
      - name: Drawing OCR source MIME support tests
        run: npm run test:ocr-source-support
      - name: Drawing generation saved-blueprint guard
        run: npm run test:drawing-generation-guard
      - name: Drawing measurement review persistence and validation
        run: npm run test:drawing-measurement-review
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
