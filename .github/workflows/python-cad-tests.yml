name: Python CAD regression tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CAD tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.in
      - name: Install CAD test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build123d>=0.13.0,<0.14.0" "pydantic>=2.14.1,<3" "pytest>=8.0" "trimesh>=5.1.1,<6" "manifold3d>=3.5.4,<4" "cryptography>=42.0.0"
          python -m pip install --no-deps -e .
      - name: Compile Python source
        run: python -m compileall -q src python-backend tests
      - name: Run CAD regression suite
        run: python -m pytest -q tests
