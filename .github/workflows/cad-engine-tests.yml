name: CAD Engine Tests

on:
  push:
    branches:
      - main
      - feat/cad-engine-reliability-upgrade-20261023
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python CAD / mesh regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install focused CAD test dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          python -m pip install "build123d>=0.13.0,<0.14.0" "pydantic>=2.14.1" "numpy>=2.2.6" "trimesh>=5.1.1" "manifold3d>=3.5.4" "cryptography>=42.0.0" "scipy>=1.13.0" "pytest>=9.1.1" "Pillow>=10.0.0" "PyMuPDF>=1.24.0" "pytesseract>=0.3.13" "fastapi>=0.115.0" "python-dotenv>=1.0.1"
      - name: Compile Python modules
        run: python -m compileall -q src/ai3d_designer python-backend tests
      - name: Run regression tests
        run: python -m pytest tests -q
